# ============================================================
# KUBERNETES CONFIGMAP - CHEATSHEET COMPLET
# ============================================================
# Stocke des données de configuration non-sensibles.
# Limite: 1MB max par ConfigMap.

apiVersion: v1
kind: ConfigMap
metadata:
  name: my-configmap
  namespace: default
  labels:
    app: my-app

# Données clé-valeur simples
data:
  # Scalaires (string)
  APP_ENV: "production"
  APP_PORT: "8080"
  LOG_LEVEL: "info"
  DATABASE_HOST: "db.example.com"
  DATABASE_PORT: "5432"

  # Fichier de configuration multi-lignes
  app.properties: |
    server.port=8080
    spring.datasource.url=jdbc:postgresql://db:5432/mydb
    logging.level.root=INFO
    cache.ttl=3600

  nginx.conf: |
    server {
        listen 80;
        server_name example.com;
        location / {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
        }
    }

  config.json: |
    {
      "database": {
        "host": "db.example.com",
        "port": 5432,
        "name": "mydb"
      },
      "cache": {
        "ttl": 3600
      }
    }

# Données binaires (base64)
binaryData:
  logo.png: <base64-encoded-content>

# Données immuables (K8s 1.21+)
# immutable: true                       # Ne peut plus être modifié après création

---
# ─────────────────────────────────────────────────────────────
# CRÉATION DE CONFIGMAP DEPUIS FICHIERS/LITERALS
# ─────────────────────────────────────────────────────────────
#
# kubectl create configmap my-config \
#   --from-literal=APP_ENV=production \
#   --from-literal=APP_PORT=8080
#
# kubectl create configmap my-config \
#   --from-file=config.properties \           # Nom du fichier = clé
#   --from-file=my-key=config.properties      # Clé personnalisée
#
# kubectl create configmap my-config \
#   --from-env-file=app.env                   # Fichier .env (KEY=VALUE)
#
# kubectl create configmap my-config \
#   --from-file=configs/                      # Tous les fichiers d'un dossier

---
# ============================================================
# KUBERNETES SECRET - CHEATSHEET COMPLET
# ============================================================
# Stocke des données sensibles (mots de passe, tokens, certificats).
# Encodées en Base64 (PAS chiffrées par défaut - utiliser Sealed Secrets ou Vault).

apiVersion: v1
kind: Secret
metadata:
  name: my-secret
  namespace: default
  labels:
    app: my-app
  annotations:
    # Pour rotation automatique (outils externes)
    reloader.stakater.com/match: "true"

type: Opaque                            # Type du Secret (voir types ci-dessous)

# Valeurs encodées en Base64 (echo -n "value" | base64)
data:
  username: dXNlcm5hbWU=               # "username"
  password: cGFzc3dvcmQ=               # "password"
  api-key: bXktYXBpLWtleQ==            # "my-api-key"

# Valeurs en clair (K8s encode automatiquement en base64)
stringData:                             # Pratique pour les fichiers de config
  database-url: "postgresql://user:pass@db:5432/mydb"
  .env: |
    DB_HOST=db.example.com
    DB_PORT=5432
    DB_PASSWORD=supersecret

# Données immuables
# immutable: true

---
# ─────────────────────────────────────────────────────────────
# TYPES DE SECRETS
# ─────────────────────────────────────────────────────────────

# 1. Opaque (par défaut - données arbitraires)
apiVersion: v1
kind: Secret
metadata:
  name: opaque-secret
type: Opaque
data:
  key: dmFsdWU=

---
# 2. kubernetes.io/service-account-token
apiVersion: v1
kind: Secret
metadata:
  name: sa-token-secret
  annotations:
    kubernetes.io/service-account.name: my-service-account
type: kubernetes.io/service-account-token

---
# 3. kubernetes.io/dockerconfigjson (pull depuis registry privé)
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: <base64-encoded-docker-config>
# Créer avec:
# kubectl create secret docker-registry registry-credentials \
#   --docker-server=registry.example.com \
#   --docker-username=myuser \
#   --docker-password=mypassword \
#   --docker-email=email@example.com

---
# 4. kubernetes.io/basic-auth
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth-secret
type: kubernetes.io/basic-auth
stringData:
  username: admin
  password: mysecretpassword

---
# 5. kubernetes.io/ssh-auth
apiVersion: v1
kind: Secret
metadata:
  name: ssh-key-secret
type: kubernetes.io/ssh-auth
data:
  ssh-privatekey: <base64-encoded-private-key>

---
# 6. kubernetes.io/tls (certificat TLS)
apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
type: kubernetes.io/tls
data:
  tls.crt: <base64-encoded-certificate>
  tls.key: <base64-encoded-private-key>
# Créer avec:
# kubectl create secret tls tls-secret \
#   --cert=path/to/tls.crt \
#   --key=path/to/tls.key

---
# 7. bootstrap.kubernetes.io/token
apiVersion: v1
kind: Secret
metadata:
  name: bootstrap-token-secret
  namespace: kube-system
type: bootstrap.kubernetes.io/token
stringData:
  token-id: "07401b"
  token-secret: "f395accd246ae52d"
  usage-bootstrap-authentication: "true"
  usage-bootstrap-signing: "true"
  auth-extra-groups: "system:bootstrappers:worker"

---
# ─────────────────────────────────────────────────────────────
# UTILISATION DANS UN POD
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: config-demo-pod
spec:
  containers:
    - name: app
      image: my-app:1.0

      # ── Variables d'env depuis ConfigMap ──
      env:
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: my-configmap
              key: APP_ENV

      # ── Variables d'env depuis Secret ──
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: my-secret
              key: password
              optional: false           # Pod échoue si absent (défaut)

      # ── Toutes les vars d'un ConfigMap ──
      envFrom:
        - configMapRef:
            name: my-configmap
        - secretRef:
            name: my-secret
        - prefix: "DB_"
          secretRef:
            name: db-secret

      volumeMounts:
        # ConfigMap monté en volume
        - name: config-files
          mountPath: /etc/config
          readOnly: true
        # Secret monté en volume
        - name: secret-files
          mountPath: /etc/secrets
          readOnly: true

  volumes:
    # ConfigMap comme volume
    - name: config-files
      configMap:
        name: my-configmap
        items:
          - key: nginx.conf
            path: nginx.conf
            mode: 0644
          - key: app.properties
            path: app.properties
        defaultMode: 0644

    # Secret comme volume
    - name: secret-files
      secret:
        secretName: my-secret
        items:
          - key: tls.crt
            path: cert.pem
          - key: tls.key
            path: key.pem
        defaultMode: 0400               # Permissions restrictives pour secrets

---
# ─────────────────────────────────────────────────────────────
# COMMANDES KUBECTL
# ─────────────────────────────────────────────────────────────
#
# ConfigMap:
#   kubectl get configmaps
#   kubectl describe configmap my-configmap
#   kubectl edit configmap my-configmap
#   kubectl delete configmap my-configmap
#
# Secret:
#   kubectl get secrets
#   kubectl describe secret my-secret     # N'affiche PAS les valeurs
#   kubectl get secret my-secret -o jsonpath='{.data.password}' | base64 -d
#   kubectl get secret my-secret -o yaml  # Affiche les valeurs base64
#
# Encoder/Décoder Base64:
#   echo -n "mysecret" | base64          # Encoder
#   echo "bXlzZWNyZXQ=" | base64 -d     # Décoder
