# ============================================================
# GESTION DES SECRETS EN PRODUCTION - CHEATSHEET
# ============================================================
# Les Secrets K8s natifs sont encodés en base64 (NON chiffrés).
# Solutions pour la prod: Sealed Secrets, External Secrets, Vault

# ─────────────────────────────────────────────────────────────
# 1. SEALED SECRETS (Bitnami)
# ─────────────────────────────────────────────────────────────
# Principe: chiffre les secrets avec la clé publique du cluster.
# Seul le cluster peut les déchiffrer. Safe à committer dans Git.
#
# Installation:
#   helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
#   helm install sealed-secrets sealed-secrets/sealed-secrets \
#     --namespace kube-system
#
# Client: kubeseal (CLI)
#   brew install kubeseal  /  apt install kubeseal

# SealedSecret (fichier commitable dans Git)
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: my-sealed-secret
  namespace: production
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "false"     # Limité au namespace
    # sealedsecrets.bitnami.com/cluster-wide: "true"    # Utilisable dans tout le cluster
    # sealedsecrets.bitnami.com/namespace-wide: "true"  # Tous les noms dans le namespace

spec:
  encryptedData:
    # Valeurs chiffrées avec kubeseal (clé publique du cluster)
    password: AgB3q2k...              # Valeur chiffrée (longue chaîne base64)
    api-key: AgC9xR1...

  template:                           # Template du Secret résultant
    metadata:
      name: my-sealed-secret
      namespace: production
      labels:
        app: my-app
    type: Opaque                      # Type du Secret

# ── Workflow kubeseal ─────────────────────────────────────────
# 1. Créer un Secret K8s normal (local, ne pas appliquer)
#    kubectl create secret generic my-secret \
#      --from-literal=password=mysecret \
#      --from-literal=api-key=myapikey \
#      --dry-run=client -o yaml > secret.yaml
#
# 2. Chiffrer avec kubeseal
#    kubeseal --format yaml < secret.yaml > sealed-secret.yaml
#    # Ou directement:
#    kubeseal --format yaml \
#      --controller-name=sealed-secrets \
#      --controller-namespace=kube-system \
#      < secret.yaml > sealed-secret.yaml
#
# 3. Committer sealed-secret.yaml dans Git (safe!)
#    git add sealed-secret.yaml
#    git commit -m "Add sealed secret for production"
#
# 4. Appliquer dans le cluster
#    kubectl apply -f sealed-secret.yaml
#    # → Le controller crée automatiquement le Secret K8s
#
# Chiffrer une valeur individuelle:
#    echo -n "mysecret" | kubeseal --raw \
#      --namespace=production \
#      --name=my-secret \
#      --from-file=/dev/stdin
#
# Récupérer la clé publique (pour CI/CD offline):
#    kubeseal --fetch-cert > public-cert.pem
#    kubeseal --cert public-cert.pem < secret.yaml > sealed.yaml
#
# Rotation des clés:
#    kubectl get secret -n kube-system -l sealedsecrets.bitnami.com/sealed-secrets-key
#    # Les anciens secrets restent déchiffrables (clés conservées)

---
# ─────────────────────────────────────────────────────────────
# 2. EXTERNAL SECRETS OPERATOR (ESO)
# ─────────────────────────────────────────────────────────────
# Synchronise les secrets depuis des stores externes (AWS, GCP, Azure, Vault...)
# vers des Secrets K8s natifs.
#
# Installation:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets \
#     --namespace external-secrets --create-namespace

# SecretStore (par namespace)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: production
spec:
  provider:
    # ── AWS Secrets Manager ──────────────────────────────
    aws:
      service: SecretsManager        # SecretsManager | ParameterStore
      region: us-east-1
      auth:
        secretRef:                   # Credentials statiques
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-access-key
        # jwt:                       # IRSA (recommandé en EKS)
        #   serviceAccountRef:
        #     name: external-secrets-sa

---
# ClusterSecretStore (partagé entre namespaces)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: global-vault
spec:
  provider:
    # ── HashiCorp Vault ──────────────────────────────────
    vault:
      server: https://vault.example.com
      path: secret                   # Mount path dans Vault
      version: v2                    # KV v1 | v2
      auth:
        kubernetes:                  # Auth via ServiceAccount K8s
          mountPath: kubernetes
          role: my-k8s-role
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
        # token:                     # Token statique
        #   secretRef:
        #     name: vault-token
        #     key: token
        #     namespace: external-secrets
      caBundle: <base64-ca>

---
# ExternalSecret - synchronise un secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: my-external-secret
  namespace: production

spec:
  # ── Fréquence de synchronisation ─────────────────────────
  refreshInterval: 1h                # Resync toutes les heures
  # refreshInterval: 0               # Synchronisation unique

  # ── Store source ─────────────────────────────────────────
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore                # SecretStore | ClusterSecretStore

  # ── Secret K8s résultant ─────────────────────────────────
  target:
    name: my-app-secrets             # Nom du Secret créé
    creationPolicy: Owner            # Owner | Merge | None | Orphan
    # Owner: ESO possède le secret (le supprime si ExternalSecret supprimé)
    # Merge: merge avec un secret existant
    # None: ne gère pas le cycle de vie
    deletionPolicy: Retain           # Retain | Delete | Merge

    template:                        # Template du Secret (optionnel)
      metadata:
        labels:
          app: my-app
      type: Opaque
      engineVersion: v2             # v1 | v2
      data:
        # Combiner plusieurs valeurs
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@db:5432/mydb"

  # ── Mapping des données ──────────────────────────────────
  data:
    # Clé spécifique d'un secret
    - secretKey: db-password         # Clé dans le Secret K8s
      remoteRef:
        key: production/db           # Chemin dans le store
        property: password           # Propriété dans le secret JSON
        version: AWSCURRENT          # AWSCURRENT | AWSPENDING | version-id

    - secretKey: api-key
      remoteRef:
        key: production/api-credentials
        property: key

    # Depuis AWS Parameter Store
    - secretKey: app-config
      remoteRef:
        key: /production/myapp/config  # Path SSM

  # Importer tout un secret (toutes les clés)
  dataFrom:
    - extract:
        key: production/myapp         # Toutes les clés du secret JSON
        version: AWSCURRENT
        decodingStrategy: None        # None | Base64 | Base64URL | Auto
    - find:
        path: production/             # Trouver par préfixe
        name:
          regexp: ".*database.*"      # Filtrer par regex
        tags:
          env: production

---
# ExternalSecret - AWS Parameter Store
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ssm-secrets
  namespace: production
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: aws-parameterstore
    kind: ClusterSecretStore
  target:
    name: ssm-app-config
  dataFrom:
    - find:
        path: /production/myapp/
        name:
          regexp: ".*"

---
# ExternalSecret - GCP Secret Manager
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gcp-secret
  namespace: production
spec:
  secretStoreRef:
    name: gcp-store
    kind: ClusterSecretStore
  target:
    name: gcp-app-secrets
  data:
    - secretKey: password
      remoteRef:
        key: projects/my-project/secrets/db-password
        version: latest              # latest | version-id

---
# ExternalSecret - Vault
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vault-secret
  namespace: production
spec:
  secretStoreRef:
    name: global-vault
    kind: ClusterSecretStore
  target:
    name: vault-app-secrets
  data:
    - secretKey: password
      remoteRef:
        key: secret/data/production/database  # KV v2
        property: password
        version: "3"                 # Version spécifique (ou "latest")

---
# PushSecret - pousse un Secret K8s vers un store externe
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-to-vault
  namespace: production
spec:
  secretStoreRefs:
    - name: global-vault
      kind: ClusterSecretStore
  selector:
    secret:
      name: my-app-secrets           # Secret K8s source
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: secret/data/production/backup-password
          property: value

---
# ─────────────────────────────────────────────────────────────
# 3. VAULT SECRETS OPERATOR (HashiCorp)
# ─────────────────────────────────────────────────────────────
# Agent Vault injecte les secrets directement dans les pods
# (sidecar ou init container)

# VaultAuth - configure l'authentification au Vault
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-auth
  namespace: production
spec:
  vaultConnectionRef: vault-connection
  method: kubernetes
  mount: kubernetes                  # Mount d'auth dans Vault
  kubernetes:
    role: my-k8s-role
    serviceAccount: my-app-sa
    audiences: ["vault"]

---
# VaultStaticSecret - secret statique Vault → K8s Secret
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-static-secret
  namespace: production
spec:
  type: kv-v2                        # kv-v1 | kv-v2
  mount: secret
  path: production/database
  destination:
    name: db-credentials             # Secret K8s créé
    create: true
    overwrite: true
    labels:
      app: my-app
  refreshAfter: 1h
  vaultAuthRef: vault-auth
  rolloutRestartTargets:             # Redémarre les pods si secret change
    - kind: Deployment
      name: my-deployment

---
# VaultDynamicSecret - secret dynamique (ex: credentials DB temporaires)
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: vault-dynamic-db
  namespace: production
spec:
  mount: database
  path: creds/my-db-role             # Vault génère des credentials temporaires
  destination:
    name: dynamic-db-creds
    create: true
  renewalPercent: 67                 # Renouveler à 67% de la durée de vie
  vaultAuthRef: vault-auth
  rolloutRestartTargets:
    - kind: Deployment
      name: my-deployment

---
# ─────────────────────────────────────────────────────────────
# ENCRYPTION AT REST (chiffrement natif K8s)
# ─────────────────────────────────────────────────────────────
# Configurer dans /etc/kubernetes/encryption-config.yaml
# puis passer --encryption-provider-config à l'API server

