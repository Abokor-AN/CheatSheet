---
# ─────────────────────────────────────────────────────────────
# COMMANDES
# ─────────────────────────────────────────────────────────────
#
# Sealed Secrets:
#   kubeseal --fetch-cert
#   kubectl get sealedsecrets -A
#   kubectl describe sealedsecret my-sealed-secret
#   # Voir le Secret résultant:
#   kubectl get secret my-sealed-secret -o yaml
#
# External Secrets:
#   kubectl get externalsecrets -A
#   kubectl describe externalsecret my-external-secret
#   # STATUS: Ready | Degraded | Error
#   kubectl get clustersecretstores
#   kubectl get secretstores -A
#   # Voir le Secret synchronisé:
#   kubectl get secret my-app-secrets -o yaml
#   # Forcer une resync:
#   kubectl annotate externalsecret my-external-secret \
#     force-sync=$(date +%s) --overwrite
#
# Vault Secrets Operator:
#   kubectl get vaultstaticsecrets -A
#   kubectl get vaultdynamicsecrets -A
#   kubectl get vaultauths -A
#   kubectl describe vaultstaticsecret vault-static-secret
